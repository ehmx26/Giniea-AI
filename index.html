<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giniea AI - Multimodal Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 z-20">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">Giniea AI</h1>
                    <span class="text-xs text-indigo-400 font-medium">Multimodal Assistant</span>
                </div>
            </div>
        </div>

        <div class="p-3 space-y-2">
            <button onclick="newChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/20 text-sm">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>New Session</span>
            </button>
        </div>

        <div class="px-3 py-2 space-y-1">
            <div class="text-xs font-semibold text-slate-500 px-3 py-2 uppercase tracking-wider">Mode Selection</div>
            <button onclick="setMode('chat')" id="modeChatBtn" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 text-sm font-medium transition">
                <i class="fa-solid fa-comments text-xs"></i>
                <span>Chat & Reasoning</span>
            </button>
            <button onclick="setMode('image')" id="modeImageBtn" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 text-sm font-medium transition">
                <i class="fa-solid fa-image text-xs"></i>
                <span>Image Generation</span>
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-slate-950 relative">
        <header class="h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 flex items-center justify-between z-10">
            <div class="flex items-center space-x-4">
                <div id="currentModeLabel" class="text-sm font-medium text-indigo-400 flex items-center space-x-2">
                    <i class="fa-solid fa-comments"></i><span>Mode: Chat & Reasoning</span>
                </div>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-4xl mx-auto w-full">
            <div class="text-center py-12 space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-indigo-400 mx-auto flex items-center justify-center shadow-xl shadow-indigo-600/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Hello, Emily! Ready to create.</h2>
                <p class="text-slate-400 text-sm max-w-md mx-auto">Switch to Image Generation mode on the left or type your prompt below to get started.</p>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="p-4 bg-slate-950 border-t border-slate-800/80">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="userInput" rows="1" placeholder="Ask a question or describe an image to generate..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-4 pr-16 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none shadow-inner transition" onkeydown="handleKey(event)"></textarea>
                <div class="absolute right-2.5 bottom-2.5 flex items-center space-x-1.5">
                    <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-9 h-9 rounded-xl flex items-center justify-center transition shadow-lg shadow-indigo-600/20">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'chat';

        function setMode(mode) {
            currentMode = mode;
            const chatBtn = document.getElementById('modeChatBtn');
            const imgBtn = document.getElementById('modeImageBtn');
            const label = document.getElementById('currentModeLabel');
            const input = document.getElementById('userInput');

            if (mode === 'image') {
                imgBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 text-sm font-medium transition";
                chatBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 text-sm font-medium transition";
                label.innerHTML = `<i class="fa-solid fa-image"></i><span>Mode: Image Generation</span>`;
                input.placeholder = "Describe the image you want to generate (e.g. A futuristic luxury perfume bottle...)";
            } else {
                chatBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 text-sm font-medium transition";
                imgBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 text-sm font-medium transition";
                label.innerHTML = `<i class="fa-solid fa-comments"></i><span>Mode: Chat & Reasoning</span>`;
                input.placeholder = "Ask a question or request assistance...";
            }
        }

        function newChat() {
            document.getElementById('chatContainer').innerHTML = `
                <div class="text-center py-12 space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-indigo-400 mx-auto flex items-center justify-center shadow-xl shadow-indigo-600/30">
                        <i class="fa-solid fa-wand-magic-sparkles text-white text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">New Session</h2>
                    <p class="text-slate-400 text-sm max-w-md mx-auto">How can Giniea AI assist you today?</p>
                </div>`;
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const container = document.getElementById('chatContainer');
            if (container.querySelector('.text-center')) {
                container.innerHTML = '';
            }

            // User bubble
            container.innerHTML += `
                <div class="flex items-start space-x-3 justify-end">
                    <div class="bg-indigo-600 text-white rounded-2xl px-4 py-3 max-w-xl text-sm shadow-md">${escapeHtml(text)}</div>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-300 shrink-0">EA</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            // AI thinking placeholder
            const aiMsgId = 'ai-msg-' + Date.now();
            const actionText = currentMode === 'image' ? 'Generating image...' : 'Giniea AI is thinking...';
            container.innerHTML += `
                <div class="flex items-start space-x-3" id="${aiMsgId}">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xs shrink-0 shadow-md">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 text-slate-200 rounded-2xl px-4 py-3 max-w-2xl text-sm shadow-md space-y-2">
                        <div class="flex items-center space-x-2 text-xs text-indigo-400 font-medium">
                            <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
                            <span>${actionText}</span>
                        </div>
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: currentMode }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await res.json();
                const msgEl = document.getElementById(aiMsgId);
                if (msgEl) {
                    let contentHTML = "";
                    if (data.reply) {
                        contentHTML += `<div>${marked.parse(data.reply)}</div>`;
                    }
                    if (data.imageUrl) {
                        contentHTML += `<div class="mt-3"><img src="${data.imageUrl}" class="rounded-xl max-w-full shadow-lg border border-slate-800" alt="Generated Image"/></div>`;
                    }
                    if (!data.reply && !data.imageUrl) {
                        contentHTML += `<div>${data.error || "No response received."}</div>`;
                    }
                    msgEl.querySelector('.space-y-2').innerHTML = contentHTML;
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {
                const msgEl = document.getElementById(aiMsgId);
                if (msgEl) {
                    msgEl.querySelector('.space-y-2').innerHTML = `<span class="text-amber-400">Error connecting to server or request timed out.</span>`;
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
