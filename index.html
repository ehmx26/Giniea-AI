<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giniea AI - Enterprise Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 z-20">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">Giniea AI</h1>
                    <span class="text-xs text-indigo-400 font-medium">Enterprise Assistant</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                <i class="fa-solid fa-angles-left"></i>
            </button>
        </div>

        <div class="p-3">
            <button onclick="newChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/20 text-sm">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>New Chat</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chatHistoryList">
            <div class="text-xs font-semibold text-slate-500 px-3 py-2 uppercase tracking-wider">Recent Conversations</div>
            <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-slate-800/60 text-slate-200 text-sm font-medium transition group">
                <i class="fa-regular fa-message text-indigo-400 text-xs"></i>
                <span class="truncate flex-1">Welcome to Giniea AI</span>
            </a>
        </div>

        <div class="p-3 border-t border-slate-800 space-y-2">
            <button onclick="openSettings()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition text-sm">
                <i class="fa-solid fa-gear text-slate-400"></i>
                <span>Settings & Guide</span>
            </button>
            <div class="px-3 py-2 rounded-xl bg-slate-900/50 border border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500 animate
